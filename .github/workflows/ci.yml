name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  PORT: 3100

jobs:
  # A new commit hasn't been reviewed: drop any earlier would-merge verdict and pending auto-merge.
  reset-merge-state:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/would-merge" > /dev/null 2>&1 || true
          if [ "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')" = true ]; then
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto
          fi

  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Workflow files only get parsed when they're triggered, often after merge; catch mistakes here.
      - name: Lint workflows (actionlint + shellcheck)
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSLo "$RUNNER_TEMP/$tarball" "https://github.com/rhysd/actionlint/releases/download/v$VERSION/$tarball"
          echo "$SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Start server
        run: |
          bun run start --port "$PORT" > server.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf "http://localhost:$PORT/" > /dev/null && exit 0
            sleep 1
          done
          cat server.log
          exit 1

      - name: Smoke tests (390px + desktop)
        run: bun run test

      - name: Find changed pages
        id: changed
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: echo "routes=$(node scripts/ci/changed-routes.mjs "origin/$BASE_REF")" >> "$GITHUB_OUTPUT"

      - name: Screenshots
        if: steps.changed.outputs.routes != ''
        env:
          SCREENSHOT_ROUTES: ${{ steps.changed.outputs.routes }}
        run: bun run screenshots

      - name: Lighthouse
        env:
          ROUTES: ${{ steps.changed.outputs.routes }}
        run: |
          args=()
          while read -r r; do
            args+=("--collect.url=http://localhost:$PORT$r")
          done < <({ printf '%s\n' / /lab; tr ',' '\n' <<< "$ROUTES"; } | grep . | sort -u)
          ./node_modules/.bin/lhci collect "${args[@]}"
          ./node_modules/.bin/lhci upload
          node scripts/ci/lighthouse-summary.mjs
          ./node_modules/.bin/lhci assert

      - name: Broken links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 2
            --accept '200..=299,403,429,502..=504,999'
            --exclude 'linkedin\.com'
            --exclude '^mailto:'
            http://localhost:3100/
            http://localhost:3100/lab
          fail: true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report
          path: |
            screenshots/
            lighthouse/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 30

  # Posts the sticky PR comment. Kept apart from `checks` so the job that runs PR code never holds a write token.
  report:
    name: report
    needs: checks
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.checks.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: ci-screenshots-branch
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Base branch, not the PR: this job holds a write token, so it only runs reviewed scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: ci-report
          path: ci-report

      - name: Publish screenshots to the ci-screenshots branch
        if: hashFiles('ci-report/screenshots/*.png') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin ci-screenshots > /dev/null; then
            git fetch --depth 1 origin ci-screenshots
            git worktree add --detach shots FETCH_HEAD
          else
            git worktree add --detach shots
            git -C shots checkout --orphan ci-screenshots
            git -C shots rm -rfq .
          fi
          dest="shots/pr-$PR/${SHA:0:7}"
          mkdir -p "$dest"
          cp ci-report/screenshots/*.png "$dest/"
          git -C shots add .
          git -C shots commit -qm "Screenshots for #$PR at ${SHA:0:7}"
          git -C shots push origin HEAD:ci-screenshots

      - name: Upsert PR comment
        env:
          RESULT: ${{ needs.checks.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/ci/pr-comment.mjs ci-report \
            "https://raw.githubusercontent.com/$REPO/ci-screenshots/pr-$PR/${SHA:0:7}" \
            "$RESULT" "$RUN_URL" > comment.md
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- ci-report -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file comment.md
          fi
